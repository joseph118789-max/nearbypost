user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    gzip on;

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name nearbypost.com www.nearbypost.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name nearbypost.com www.nearbypost.com;
        ssl_certificate /etc/ssl/certs/nearbypost.crt;
        ssl_certificate_key /etc/ssl/private/nearbypost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /var/www/nearbypost/public;
        index index.php index.html;

        # PHP files - no auth (Adminer)
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Public routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Admin routes only - protected (regex matches /admin and /admin-login, NOT /adminer.php)
        location ~ ^/(admin|admin-login)$ {
            auth_basic "Nearbypost Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;
            try_files $uri $uri.html /admin.html;
        }

        # Admin HTML files - protected
        location ~ ^/admin\.html$ {
            auth_basic "Nearbypost Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        location ~ ^/admin-login\.html$ {
            auth_basic "Nearbypost Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        # API proxy
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

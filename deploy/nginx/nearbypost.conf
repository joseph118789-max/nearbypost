server {
    listen 127.0.0.1:8080;
    server_name nearbypost.com www.nearbypost.com ingest.nearbypost.com;

    root /var/www/nearbypost/public;

    # Laravel front controller only. index.html must NOT be listed here:
    # a stale raw Blade file at public/index.html took the site down (6 Aug - 31 Aug 2026).
    index index.php;

    charset utf-8;
    client_max_body_size 25M;

    # ── Response security headers ───────────────────────────────────────
    # `always` so they are sent on error responses too.
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    # robots.txt and the sitemaps are generated by the application so they
    # stay in step with the places and topics that actually exist.

    # Admin pages - password protected (restored; dropped by the 6 Aug rewrite)
    location ^~ /admin-login.html {
        auth_basic "Nearbypost Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location ^~ /admin.html {
        auth_basic "Nearbypost Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location ^~ /admin2.html {
        auth_basic "Nearbypost Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # /api/ is served by php-fpm through the front controller below.
    # It used to proxy to "php artisan serve" on 127.0.0.1:8000 - a
    # single-threaded development server that nothing restarts if it dies.
    # Laravel registers routes/api.php, so the normal request path serves it.

    # Everything else -> Laravel routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
